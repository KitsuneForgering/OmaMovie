<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>OmaMovie</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26283a"/>
      <stop offset="1" stop-color="#121320"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fb4ff"/>
      <stop offset="1" stop-color="#5d7cf0"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- Film strip edges: the timeline -->
  <g fill="#3a3d55">
    <rect x="40" y="62" width="176" height="20" rx="6"/>
    <rect x="40" y="174" width="176" height="20" rx="6"/>
  </g>
  <g fill="#1a1b2a">
    <rect x="52" y="68" width="14" height="8" rx="2"/>
    <rect x="84" y="68" width="14" height="8" rx="2"/>
    <rect x="116" y="68" width="14" height="8" rx="2"/>
    <rect x="148" y="68" width="14" height="8" rx="2"/>
    <rect x="180" y="68" width="14" height="8" rx="2"/>
    <rect x="52" y="180" width="14" height="8" rx="2"/>
    <rect x="84" y="180" width="14" height="8" rx="2"/>
    <rect x="116" y="180" width="14" height="8" rx="2"/>
    <rect x="148" y="180" width="14" height="8" rx="2"/>
    <rect x="180" y="180" width="14" height="8" rx="2"/>
  </g>
  <!-- Play mark over the frame -->
  <path d="M108 98 L164 128 L108 158 Z" fill="url(#accent)" stroke="url(#accent)" stroke-width="10" stroke-linejoin="round"/>
  <!-- Playhead -->
  <rect x="190" y="52" width="6" height="152" rx="3" fill="#f38ba8"/>
  <path d="M184 46 h18 l-9 12 z" fill="#f38ba8"/>
</svg>
