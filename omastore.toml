# OmaStore manifest (https://github.com/KitsuneSemCalda — OmaStore). Read from the default branch.
# System dependencies come from the PKGBUILD (`omastore deps`).
kind = "app"
name = "OmaMovie"
summary = "Native video editor for Omarchy: a simple, iMovie-inspired interface on a GPU-first Vulkan pipeline, exporting to MP4."
categories = ["AudioVideo", "Video", "AudioVideoEditing"]
icon = "packaging/icons/omamovie.svg"

# Releases ship omamovie-<version>-x86_64-linux.tar.gz holding the tree `make install` lays out
# (usr/bin/omamovie finds its QML in usr/share/omamovie/qml); see .github/workflows/release.yml.
[linux.x86_64]
asset = "omamovie-{version}-x86_64-linux.tar.gz"
exec = "usr/bin/omamovie"
