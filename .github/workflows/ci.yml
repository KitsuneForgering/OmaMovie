name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # Arch Linux container: same toolchain as Omarchy (current GCC/Clang).
  # The container runs through `docker run` so the host kernel can be tuned first:
  # ThreadSanitizer fails with the default mmap entropy of recent runners.
  test:
    name: ${{ matrix.compiler }} / ${{ matrix.build }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        build: [debug, asan, tsan, release]
    steps:
      - uses: actions/checkout@v7

      - name: Lower mmap_rnd_bits for TSan
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Build and test
        run: |
          docker run --rm --cap-add SYS_PTRACE \
            -v "$PWD:/src" -w /src archlinux:latest bash -euo pipefail -c '
              pacman -Syu --noconfirm >/dev/null
              scripts/deps.sh --install --noconfirm >/dev/null
              # The app too (debug and release): CI otherwise never compiles apps/omamovie.
              app=""
              case "${{ matrix.build }}" in debug|release) app="build/${{ matrix.build }}/omamovie" ;; esac
              make -j"$(nproc)" BUILD=${{ matrix.build }} CXX=${{ matrix.compiler }} \
                test $app JUNIT_DIR=build/junit
            '

      - name: JUnit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.compiler }}-${{ matrix.build }}
          path: build/junit/
          if-no-files-found: ignore

  lint:
    name: format and clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: clang-format and clang-tidy
        run: |
          docker run --rm -v "$PWD:/src" -w /src archlinux:latest bash -euo pipefail -c '
            pacman -Syu --noconfirm >/dev/null
            scripts/deps.sh --install --noconfirm >/dev/null
            make format-check
            make compdb
            make tidy
          '

  fuzz:
    name: parser fuzzing (libFuzzer, ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fuzz the parsers of untrusted files
        run: |
          docker run --rm -v "$PWD:/src" -w /src archlinux:latest bash -euo pipefail -c '
            pacman -Syu --noconfirm >/dev/null
            scripts/deps.sh --install --noconfirm >/dev/null
            make fuzz FUZZ_RUNS=500000
          '
