name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # Arch Linux container: same toolchain as Omarchy (current GCC/Clang).
  # The container runs through `docker run` so the host kernel can be tuned first:
  # ThreadSanitizer fails with the default mmap entropy of recent runners.
  test:
    name: ${{ matrix.compiler }} / ${{ matrix.build }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        build: [debug, asan, tsan, release]
    steps:
      - uses: actions/checkout@v7

      - name: Lower mmap_rnd_bits for TSan
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Build and test
        run: bash scripts/ci-run.sh test '${{ matrix.compiler }}' '${{ matrix.build }}'

      - name: JUnit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.compiler }}-${{ matrix.build }}
          path: build/junit/
          if-no-files-found: ignore

  smoke:
    name: GUI smoke (headless sway, lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the GUI smoke on a headless compositor
        run: bash scripts/ci-run.sh smoke

  lint:
    name: format and clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: clang-format and clang-tidy
        run: bash scripts/ci-run.sh lint

  fuzz:
    name: parser fuzzing (libFuzzer, ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fuzz the parsers of untrusted files
        run: bash scripts/ci-run.sh fuzz
