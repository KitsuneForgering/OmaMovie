name: Release

# Tag vX.Y.Z (or vX.Y.Z-rc.N) → release build + tests → GitHub Release with notes generated
# from Conventional Commits, the source tarball and the app as omamovie-<version>-x86_64-linux.tar.gz
# (the tree `make install` lays out under usr/, which omastore.toml points OmaStore at). Qt 6,
# FFmpeg and Vulkan stay system libraries (Arch packages, PKGBUILD depends).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build and test (release)
        run: |
          docker run --rm -v "$PWD:/src" -w /src archlinux:latest bash -euo pipefail -c '
            pacman -Syu --noconfirm >/dev/null
            scripts/deps.sh --install --no-dev --noconfirm >/dev/null
            make -j"$(nproc)" BUILD=release test build/release/omamovie
            make BUILD=release DESTDIR=/src/stage PREFIX=/usr install
          '

      - name: Release notes and source tarball
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          scripts/changelog.sh "$tag" > release-notes.md
          git archive --format=tar.gz --prefix="oma-movie-${version}/" -o "oma-movie-${version}-src.tar.gz" "$tag"
          sha256sum "oma-movie-${version}-src.tar.gz" > "oma-movie-${version}-src.tar.gz.sha256"
          app="omamovie-${version}-x86_64-linux.tar.gz"
          tar --owner=0 --group=0 -C stage -czf "$app" usr
          sha256sum "$app" > "$app.sha256"
          cat release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          prerelease=""
          if [[ $tag == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$tag" $prerelease \
            --title "OmaMovie ${version}" \
            --notes-file release-notes.md \
            "oma-movie-${version}-src.tar.gz" "oma-movie-${version}-src.tar.gz.sha256" \
            "omamovie-${version}-x86_64-linux.tar.gz" "omamovie-${version}-x86_64-linux.tar.gz.sha256"
